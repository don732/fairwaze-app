[build]
  publish = "."
  functions = "netlify/functions"
  command = "echo 'No build step'"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/t/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/new"
  to = "/new.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/home.html"
  status = 200
  force = true

[[redirects]]
  from = "/home"
  to = "/home.html"
  status = 200

[[redirects]]
  from = "https://www.fairwaze.app/*"
  to = "https://fairwaze.app/:splat"
  status = 301
  force = true
