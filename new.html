<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Condensed:wght@500;600;700;800&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>:root{--green:#0b3d24;--felt:#11553a;--cream:#f3ead0;--paper:#fbf6e4;--ink:#000;--lime:#c8ff1a;--amber:#e89b1c;--red:#e2231a;--slot:#fffdf6;
--disp:'Alfa Slab One',Rockwell,Georgia,serif;--cond:'Barlow Condensed','Arial Narrow',sans-serif;--hand:'Permanent Marker','Comic Sans MS',cursive}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--green) repeating-linear-gradient(90deg,#0d4429 0 56px,#0b3d24 56px 112px);color:var(--cream);font:500 18px/1.4 var(--cond);min-height:100vh}
a,[data-nav]{color:inherit}
main{max-width:720px;margin:0 auto;padding:12px 14px 110px}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.sponsor{background:#000;color:var(--cream);text-align:center;padding:calc(7px + env(safe-area-inset-top,0px)) 10px 7px;font-size:14px;letter-spacing:.04em;border-bottom:3px solid var(--amber);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sponsor b{font-family:var(--disp);font-weight:400;color:var(--amber)} .sponsor em{opacity:.75}.sp-by{opacity:.55}
.nav{flex:none;display:flex;background:#000;border-top:3px solid var(--lime);padding-bottom:env(safe-area-inset-bottom);z-index:40}
.nav [data-nav]{flex:1;text-align:center;text-decoration:none;padding:8px 0 10px;font-weight:700;font-size:13px;color:#bdb59b;text-transform:uppercase;letter-spacing:.05em}
.nav [data-nav] span{display:block;font-size:20px;line-height:1.1}.nav [data-nav].on{color:var(--lime)}
.foot{text-align:center;padding:10px 20px 110px;opacity:.8;font-size:15px}
.scribble{font-family:var(--hand);color:var(--lime);transform:rotate(-1.5deg)} .scribble.sm{font-size:14px;color:var(--amber)}
.pagetitle{font:400 clamp(34px,9vw,58px)/.95 var(--disp);margin:18px 0 6px;color:var(--cream);text-shadow:3px 3px 0 #000}
.sub{margin:0 0 16px;color:#d8cfb3}
.sec{font:400 24px var(--disp);color:var(--amber);margin:28px 0 10px;text-shadow:2px 2px 0 #000}.sec.lt{color:var(--lime)}
.note{font-size:15px;color:#cfc6a8}.center{text-align:center}.redt{color:var(--red)}
.k{font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:14px;color:var(--amber);margin:0}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;font:400 20px var(--disp);background:var(--lime);color:#000;border:3px solid #000;box-shadow:5px 5px 0 #000;padding:13px 18px;border-radius:4px;text-decoration:none;cursor:pointer;margin:8px 0;text-align:center}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 #000}
.btn.wide{display:flex;width:100%}.btn.big{font-size:26px;padding:18px}.btn.sm{font-size:15px;padding:8px 12px}
.btn.amber{background:var(--amber)}.btn.red{background:var(--red);color:#fff}.btn.ghost{background:var(--cream)}
.lnk{background:none;border:0;color:var(--lime);font:700 16px var(--cond);text-decoration:underline;cursor:pointer}.lnk.red{color:#ff7a70}
.chip{display:inline-block;font-weight:800;font-size:14px;letter-spacing:.06em;background:#000;color:var(--lime);padding:3px 9px;border-radius:3px;margin:2px 4px 2px 0}
.chip.amber{background:var(--amber);color:#000}.chip.red{background:var(--red);color:#fff}.chip.ghost{background:transparent;border:2px solid #000;color:#000}
.sticker{display:inline-block;font:400 15px var(--hand);background:var(--lime);color:#000;border:2px solid #000;padding:2px 9px;transform:rotate(-4deg);box-shadow:3px 3px 0 #000}
.sticker.big{font-size:22px}
/* Masters-style manual board */
.board{background:var(--green);border:5px solid #073019;box-shadow:0 0 0 3px var(--cream),8px 10px 0 3px #000;margin:18px 0;padding:6px;border-radius:2px}
.board-h{font:400 18px var(--disp);color:var(--cream);text-align:center;padding:6px 8px 8px;display:flex;justify-content:space-between;text-transform:uppercase}
.board.cd .board-h{justify-content:center}
.board-f{text-align:center;color:var(--cream);font-weight:700;letter-spacing:.06em;padding:6px;text-transform:uppercase;font-size:14px}
.slot{background:var(--slot);color:#000;font:800 22px/1 var(--cond);display:flex;align-items:center;justify-content:center;border:1px solid #bfb699;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08);min-height:40px;padding:0 6px}
.slot.red,.red{color:var(--red)}
.cd-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.cd-cell{text-align:center}.cd-cell small{display:block;color:var(--cream);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:13px;margin-top:4px}
.slot.big{font:400 clamp(40px,13vw,76px)/1 var(--disp);min-height:clamp(64px,18vw,104px)}
.strip{display:grid;grid-template-columns:48px 34px 1fr 64px;gap:4px;margin:4px 0;text-decoration:none;align-items:center}
.strip .nm{justify-content:flex-start;letter-spacing:.08em;font-size:24px}.strip .pts{font-size:26px}
.mv{font-style:normal;font-weight:800;font-size:14px;text-align:center}.mv.up{color:var(--lime)}.mv.dn{color:#ff6e63}.mv.eq{color:#bdb59b}.mv.new{color:var(--amber)}
/* hero */
.hero{position:relative;text-align:center;padding:10px 0 6px}
.mast{font:400 clamp(40px,12vw,84px)/.9 var(--disp);color:var(--cream);margin:10px 0;text-shadow:4px 4px 0 #000;letter-spacing:-.01em}
.mast span{display:block;font:italic 700 .38em var(--cond);color:var(--lime);letter-spacing:.3em;text-transform:uppercase;text-shadow:none}
.mast.sm{font-size:clamp(46px,14vw,90px)}
.dates{font:400 22px var(--disp);color:var(--amber);margin:6px 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 0}.stats div{background:#000;border:2px solid var(--cream);padding:6px 0;text-transform:uppercase;font-weight:700;font-size:13px;letter-spacing:.08em}
.stats b{display:block;font:400 34px var(--disp);color:var(--lime);line-height:1.1}
.hero-collage{position:relative;height:150px;display:flex;justify-content:center;align-items:center}
.flagart{height:150px}
.pol{background:#fff;padding:7px 7px 26px;margin:0;box-shadow:4px 6px 0 rgba(0,0,0,.6);position:relative;clip-path:polygon(0 2%,6% 0,20% 2%,40% 0,62% 2%,80% 0,100% 1%,99% 30%,100% 60%,98% 100%,70% 98%,45% 100%,20% 98%,0 100%,2% 60%)}
.pol .ph{height:100%;min-height:110px}.pol figcaption{position:absolute;bottom:3px;left:8px;right:8px;font:400 13px var(--hand);color:#000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-collage .pol{width:120px;height:140px;position:absolute}.hero-collage .p0{transform:rotate(-8deg) translateX(-110px)}.hero-collage .p1{transform:rotate(5deg) translateX(-20px) translateY(-6px);z-index:2}.hero-collage .p2{transform:rotate(-3deg) translateX(80px)}.hero-collage .p3{transform:rotate(9deg) translateX(150px) translateY(10px)}
.livebug{display:inline-flex;align-items:center;gap:8px;background:var(--red);color:#fff;font:400 18px var(--disp);padding:6px 14px;border:3px solid #000;transform:rotate(-2deg);text-transform:uppercase}
.livebug i{width:10px;height:10px;border-radius:50%;background:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.2}}
.leadcard{display:grid;grid-template-columns:42% 1fr;gap:12px;align-items:center;text-align:left;margin-top:16px}
.lead-ph{aspect-ratio:3/4;border:4px solid var(--cream);box-shadow:6px 6px 0 #000}
.bigpts{font:400 48px var(--disp);color:var(--lime);margin:0;line-height:1}.bigpts small{font-size:.4em;color:var(--cream)}
.k2{font-weight:700;letter-spacing:.08em;color:#cfc6a8;text-transform:uppercase;font-size:14px}
.hero.champ .crest svg{width:150px}
/* ticket */
.ticket{display:grid;grid-template-columns:70px 1fr;background:var(--paper);color:#000;text-decoration:none;border:3px solid #000;box-shadow:6px 6px 0 #000}
.tk-n{background:var(--red);color:#fff;font:400 34px var(--disp);display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);border-left:3px dashed #000}
.tk-b{padding:12px 14px;display:flex;flex-direction:column;gap:2px}.tk-b b{font:400 24px/1 var(--disp)}.tk-b span{font-weight:600}
.tk-teams{margin:6px 0;font-size:16px}.tk-teams em{font-style:normal;font-weight:800}
.avail{font-weight:800;color:var(--felt)}
/* photos */
.ph{background:#1b1b1b center/cover no-repeat;position:relative;overflow:hidden}
.ph-empty{background:var(--felt) radial-gradient(circle at 30% 30%,rgba(255,255,255,.12) 2px,transparent 3px) 0 0/14px 14px}
.ph.mono{display:flex;align-items:center;justify-content:center}.ph.mono b{font:400 min(18vw,90px) var(--disp);color:var(--cream);text-shadow:4px 4px 0 #000}
.t-comic{filter:contrast(1.45) saturate(1.5)}
.t-comic::after,.t-halftone::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(0,0,0,.55) 1.1px,transparent 1.6px) 0 0/6px 6px;mix-blend-mode:multiply}
.t-halftone{filter:grayscale(1) contrast(1.6)}.t-halftone::before{content:"";position:absolute;inset:0;background:var(--lime);mix-blend-mode:multiply;opacity:.55}
.t-poster{filter:grayscale(1) contrast(2.1) brightness(1.05)}.t-poster::before{content:"";position:absolute;inset:0;background:linear-gradient(#0b3d24,#0b3d24);mix-blend-mode:screen;opacity:.8}
.t-sticker{outline:6px solid #fff;outline-offset:-6px;box-shadow:0 0 0 3px #000;filter:saturate(1.3)}
.t-polaroid{filter:sepia(.25) contrast(1.1)}
.poster-cart{position:relative;margin:26px 0;border:4px solid #000;box-shadow:8px 8px 0 #000}.poster-cart .ph{aspect-ratio:4/3}
.poster-cart h3{position:absolute;left:0;right:0;bottom:0;margin:0;padding:14px;font:400 clamp(26px,7vw,44px)/.95 var(--disp);color:var(--lime);background:linear-gradient(transparent,#000 70%);text-shadow:3px 3px 0 #000}
.ad-beer{display:grid;grid-template-columns:45% 1fr;background:var(--amber);color:#000;border:4px solid #000;box-shadow:8px 8px 0 #000;margin:26px 0}
.ad-beer .ph{height:100%;min-height:200px;border-right:4px solid #000}.ad-r{padding:14px}.ad-r small{font:400 16px var(--hand)}.ad-r h3{font:400 30px/.95 var(--disp);margin:6px 0}.ad-r p{margin:0;font-weight:700}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:16px}.gallery .pol{height:180px}.gallery .g0{transform:rotate(-3deg)}.gallery .g1{transform:rotate(2deg)}.gallery .g2{transform:rotate(-1deg)}
/* rounds */
.rstrip{display:grid;gap:8px}.rs{display:grid;grid-template-columns:48px 1fr auto;grid-template-rows:auto auto;column-gap:10px;background:#000;border-left:6px solid var(--amber);padding:8px 10px;text-decoration:none}
.rs b{grid-row:span 2;font:400 26px var(--disp);color:var(--amber);align-self:center}.rs span{font-weight:800}.rs small{color:#bdb59b;grid-column:2}.rs em{grid-row:1/3;grid-column:3;align-self:center;font-style:normal;font-weight:800;color:var(--lime)}
.rs.final{border-left-color:var(--red)}
.poster{display:block;background:var(--paper);color:#000;text-decoration:none;border:4px solid #000;box-shadow:8px 8px 0 #000;margin:18px 0 22px;padding:14px;position:relative;overflow:hidden}
.poster::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:#fff radial-gradient(circle,#ddd 2px,transparent 3px) 0 0/10px 10px;border:3px solid #000;opacity:.9}
.poster-top{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;position:relative;z-index:1}
.rn{font:400 64px/1 var(--disp);color:transparent;-webkit-text-stroke:2px #000;text-shadow:4px 4px 0 var(--lime)}
.poster h2{font:400 clamp(26px,7vw,40px)/.95 var(--disp);margin:2px 0}.course{margin:2px 0 0;font-weight:800;font-size:20px;color:var(--felt)}
.poster-meta{margin-top:10px;position:relative;z-index:1}
.teams{display:grid;gap:10px;align-items:stretch}.teams.t2{grid-template-columns:1fr auto 1fr}.teams.t4{grid-template-columns:1fr 1fr}
.team{background:#000;border:3px solid var(--cream);padding:10px}.team h3{font:400 18px var(--disp);color:var(--lime);margin:0 0 6px}
.tm{display:flex;justify-content:space-between;border-bottom:1px dashed #555;padding:3px 0;font-size:17px}.tm [data-nav]{text-decoration:none;font-weight:700}.tm span{color:var(--amber);font-weight:800}
.tt{display:flex;justify-content:space-between;margin-top:6px}.tt span{font-size:14px;text-transform:uppercase;letter-spacing:.06em}.tt b{font:400 24px var(--disp);color:var(--cream)}
.vs{align-self:center;font:400 26px var(--disp);color:var(--red);text-shadow:2px 2px 0 #000}
.gap{text-align:center;font-weight:800;color:var(--amber)}
.dead-even{text-align:center;margin:18px 0;background:var(--red);color:#fff;border:4px solid #000;box-shadow:6px 6px 0 #000;padding:12px;transform:rotate(-1deg)}
.dead-even b{font:400 clamp(44px,14vw,80px)/1 var(--disp)}.dead-even i{font:italic 800 28px var(--cond);margin:0 12px;vertical-align:middle}.dead-even p{font:400 clamp(24px,7vw,38px) var(--disp);margin:4px 0 0;color:var(--lime);text-shadow:2px 2px 0 #000}
.how{background:var(--lime);color:#000;border:3px solid #000;box-shadow:5px 5px 0 #000;margin:16px 0;padding:0}
.how summary{font:400 22px var(--disp);padding:14px;cursor:pointer;list-style:none}.how summary::-webkit-details-marker{display:none}.how summary::after{content:" +";float:right}.how[open] summary::after{content:" −"}
.how ol,.how ul{margin:0;padding:0 18px 12px 40px;font-weight:600}.how li{margin:5px 0}.how .scribble{color:var(--red);padding:0 14px 12px;margin:0}.how .note{color:#333;padding:0 14px 12px;margin:0}
.how.alt{background:var(--cream)}
.results{margin-top:10px}.tbl-wrap{overflow-x:auto;border:3px solid #000;box-shadow:5px 5px 0 #000}
table.res{border-collapse:collapse;width:100%;background:var(--paper);color:#000;font-size:16px}
.res th{background:var(--green);color:var(--cream);padding:6px;font-weight:700;text-transform:uppercase;font-size:13px}.res td{padding:6px;border-top:1px solid #d8cfb0;text-align:center;font-variant-numeric:tabular-nums}.res td:nth-child(2){text-align:left;font-weight:700}
.res .tot{font:400 20px var(--disp);color:var(--red)}.dropped{color:#a33;font-weight:800}
.teamres{display:grid;gap:8px;margin:12px 0}.teamres>div{background:#000;border:2px solid #555;padding:10px;position:relative;display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.teamres .win{border-color:var(--lime)}.teamres small{width:100%;color:#bdb59b}.place{font:400 22px var(--disp);color:var(--amber)}.ptsb{margin-left:auto;font-weight:800;color:var(--lime)}
.stamp{font:400 15px var(--disp);color:var(--red);border:3px solid var(--red);padding:1px 8px;transform:rotate(-8deg);display:inline-block;background:var(--paper)}.stamp.big{font-size:28px}
/* full board */
.board.full .grid{display:grid;grid-template-columns:40px minmax(70px,1fr) repeat(5,38px) 50px;gap:3px;align-items:center}
.board.full .board-h.grid{font:700 13px var(--cond);letter-spacing:.06em}.board.full .board-h span{text-align:center}
.row{text-decoration:none;margin:3px 0}.row .slot{font-size:18px;min-height:36px;padding:0 2px}.row .nm{justify-content:flex-start;gap:4px;font-size:18px;padding-left:4px}
.row .pts{font:400 20px var(--disp)}.slot.dnp{font-size:12px;color:#777;background:#e8e2cd}.slot.pend{color:#bbb}
.slot.pond{text-decoration:line-through;text-decoration-thickness:2px;color:#9b937b;background:#cfe7f2 radial-gradient(ellipse at 50% 120%,#9fd0e6 40%,transparent 41%)}
.adjnote{font-size:13px;color:var(--amber);text-align:right;margin:-2px 2px 4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:#cfc6a8}.pond-s{color:#9fd0e6}
/* scenarios */
.scen{background:var(--paper);color:#000;border:3px solid #000;box-shadow:5px 5px 0 #000;padding:12px;margin:14px 0;border-left:12px solid #888}
.scen.g{border-left-color:var(--felt)}.scen.l{border-left-color:#8fbf00}.scen.a{border-left-color:var(--amber)}.scen.x{border-left-color:var(--red);opacity:.85}
.sc-h{display:flex;justify-content:space-between;font:400 22px var(--disp)}
.verdict{display:inline-block;font:400 18px var(--disp);background:#000;color:var(--lime);padding:3px 10px;margin:6px 0;transform:rotate(-1deg)}.scen.x .verdict{color:#ff7a70}.scen.a .verdict{color:var(--amber)}
.sc-g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-weight:800;font-size:20px}.sc-g small{display:block;font-size:12px;text-transform:uppercase;color:#555;letter-spacing:.06em}
.path{margin:8px 0 0;font-weight:600}
.locked-card{background:#000;border:3px dashed var(--amber);padding:16px;text-align:center}.locked-card .big{font:400 26px var(--disp);color:var(--amber);margin:0 0 6px}
/* matrix */
table.matrix{border-collapse:collapse;background:var(--paper);color:#000;width:100%;font-size:15px}
.matrix th{padding:5px;background:var(--green);color:var(--cream);font-weight:700}.matrix td{text-align:center;padding:7px 0;border:1px solid #d6ccad;font-weight:800;min-width:34px}
.matrix .h1{background:#e4f5b0}.matrix .h2{background:var(--lime)}.matrix .h3{background:var(--amber)}.matrix .self{background:#ddd6bf}
.mate-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.mc{background:#000;border:2px solid var(--cream);padding:10px}.mc small{color:var(--amber);font-weight:800;text-transform:uppercase}.mc p{margin:4px 0;font-weight:700}
/* player cards */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tcard{background:var(--cream);color:#000;text-decoration:none;border:4px solid #000;border-radius:10px;box-shadow:5px 5px 0 #000;overflow:hidden;display:flex;flex-direction:column}
.tcard:nth-child(odd){transform:rotate(-1deg)}.tcard:nth-child(even){transform:rotate(1deg)}
.tc-ph{aspect-ratio:4/5;border-bottom:4px solid #000}.tc-band{background:var(--green);color:var(--cream);padding:6px 8px;position:relative}.tc-band b{font:400 17px/1 var(--disp);display:block}
.tc-band .sticker{position:absolute;right:6px;top:-18px;font-size:13px}
.tc-stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;font:400 18px var(--disp);padding:6px 2px}.tc-stats small{display:block;font:700 11px var(--cond);text-transform:uppercase}
.mag{position:relative;border:4px solid #000;box-shadow:8px 8px 0 #000;background:#000;margin:14px 0;overflow:hidden}
.mag-ph{aspect-ratio:4/5}
.mag-mast{position:absolute;top:8px;left:0;right:0;text-align:center;z-index:2;font:400 clamp(30px,9vw,54px)/1 var(--disp);color:var(--red);text-shadow:3px 3px 0 #fff}
.mag-lines{position:absolute;top:30%;left:10px;z-index:2;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.ml1,.ml2{background:#000;color:var(--lime);font:800 20px var(--cond);padding:2px 8px;text-transform:uppercase}.ml2{font:400 30px var(--disp);color:var(--amber)}
.mag-name{position:absolute;bottom:30px;left:0;right:0;margin:0;padding:0 12px;z-index:2;font:400 clamp(36px,11vw,64px)/.9 var(--disp);color:#fff;text-shadow:4px 4px 0 #000}
.mag-issue{position:absolute;bottom:8px;left:12px;z-index:2;font-weight:800;color:var(--cream);text-transform:uppercase;font-size:13px}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.statgrid div,.facts div{background:#000;border:2px solid #333;padding:6px;text-align:center;font:400 20px var(--disp);color:var(--cream)}
.statgrid small,.facts small{display:block;font:700 11px var(--cond);text-transform:uppercase;color:var(--amber);letter-spacing:.05em}
.rbr{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.rbr>*{background:var(--slot);color:#000;text-decoration:none;text-align:center;padding:8px 2px;border:2px solid #000;position:relative}
.rbr small{display:block;font-weight:800}.rbr b{font:400 24px var(--disp)}.rbr .dnp{background:#d9d2bb;color:#666}.rbr .pond{background:#cfe7f2}.rbr .pond b{text-decoration:line-through}.rbr em{display:block;font:400 10px var(--hand);color:#1f6f94}
.scout{background:var(--paper);color:#000;padding:12px;border:3px solid #000;font-weight:600;transform:rotate(-.5deg)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.facts div{font:600 17px var(--cond)}
.matelist{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.matelist [data-nav]{background:#000;text-decoration:none;text-align:center;padding:6px;border:2px solid #333}.matelist b{display:block;font:400 22px var(--disp);color:var(--lime)}
.hall-row{display:grid;grid-template-columns:90px 1fr;gap:12px;background:var(--paper);color:#000;border:3px solid #000;padding:10px;margin:8px 0;align-items:center}.yr{font:400 32px var(--disp);color:var(--red)}.hall-row small{display:block}
.crest.solo{text-align:center}.crest.solo svg{width:160px}
.menu{display:grid;gap:10px}.menu [data-nav]{background:#000;border:3px solid var(--cream);padding:14px;text-decoration:none}.menu b{display:block;font:400 22px var(--disp);color:var(--lime)}
/* admin */
.gate{text-align:center}.pin{width:100%;font:400 34px var(--disp);text-align:center;padding:12px;border:3px solid #000;background:var(--slot);letter-spacing:.3em;margin:8px 0}
.adbar{display:flex;justify-content:space-between;align-items:center;background:var(--red);color:#fff;padding:6px 10px;border:3px solid #000;margin-top:8px}.adbar b{font:400 18px var(--disp)}.adbar .lnk{color:#fff}
.tabs{display:flex;overflow-x:auto;gap:4px;margin:8px 0;padding-bottom:4px}.tabs [data-nav]{flex:none;background:#000;padding:8px 12px;text-decoration:none;font-weight:800;border:2px solid #333}.tabs [data-nav].on{background:var(--lime);color:#000;border-color:#000}
.rpick,.seg{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}.rpick button,.seg button{flex:1;font:800 17px var(--cond);padding:10px 6px;background:var(--cream);border:2px solid #000;color:#000;cursor:pointer;min-width:48px}
.rpick button.on,.seg button.on{background:var(--lime)}.rpick button.final{box-shadow:inset 0 -4px 0 var(--red)}.seg button.on.red{background:var(--red);color:#fff}.seg.sm button{padding:6px 4px;font-size:15px}.seg.xs button{font-size:13px;padding:4px}
.entry{background:var(--paper);color:#000;border:3px solid #000;box-shadow:5px 5px 0 #000;padding:6px 10px;margin:10px 0}
.entry-team{font:400 16px var(--disp);color:var(--felt);margin:10px 0 2px}
.erow{display:grid;grid-template-columns:1fr 70px 96px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dashed #cfc5a4}.erow.team{grid-template-columns:1fr 110px}
.erow label{font:400 20px var(--disp)}.erow label small{display:block;font:600 14px var(--cond);color:#555}
.erow input{font:400 26px var(--disp);text-align:center;padding:8px 4px;border:2px solid #000;background:#fff;width:100%;border-radius:0}.ph-in{font-size:18px!important;background:#efe9d6!important}
.warn{background:var(--amber);color:#000;border:3px solid #000;padding:10px;font-weight:700;margin:10px 0}
.finalbox{background:#000;border:3px solid var(--red);padding:12px;text-align:center}
.assign .arow,.tborder .arow{display:grid;grid-template-columns:80px 1fr;align-items:center;gap:6px;background:#000;padding:4px 8px;margin:4px 0}
.drawcard{background:var(--paper);color:#000;border:4px solid #000;box-shadow:6px 6px 0 #000;padding:12px;margin:14px 0}
.dc{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}.dc h3{font:400 20px var(--disp);margin:0;color:var(--red)}.dc p{margin:2px 0;font-weight:800}.dc b{font:400 30px var(--disp)}.dc i{font:400 30px var(--disp);color:var(--red)}
.dc.big p{font-size:24px;color:var(--cream)}.dc.big b{color:var(--lime);font-size:44px}.why{font-weight:700;margin:8px 0 0;padding-left:20px}
.freeze{background:#000;border:3px solid var(--amber);padding:10px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.freeze p{margin:0}
.pedit{background:#000;border:2px solid #333;margin:6px 0}.pedit summary{display:flex;align-items:center;gap:10px;padding:8px;cursor:pointer}.pedit summary span{margin-left:auto;color:var(--amber);font-weight:800}
.mini{width:40px;height:40px;border-radius:50%}.mini.mono b{font-size:16px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}.fgrid label,.mitem label{display:flex;flex-direction:column;font-weight:700;font-size:14px;gap:2px}.fgrid .full{grid-column:1/-1}
input,select,textarea{font:600 17px var(--cond);padding:8px;border:2px solid #000;background:var(--slot);color:#000;border-radius:0;width:100%}
.cropper{display:grid;grid-template-columns:120px 1fr;gap:8px}.crop-prev{grid-row:span 3;aspect-ratio:4/5}
.mlist{display:grid;gap:10px}.mitem{display:grid;grid-template-columns:110px 1fr;gap:10px;background:#000;padding:8px;border:2px solid #333}.mitem>.ph{height:130px}.mitem>div{display:flex;flex-direction:column;gap:6px}
.up input{display:none}.vid video{width:100%;border:3px solid #000;background:#000}
.adjrow{display:flex;gap:10px;align-items:center;background:#000;padding:8px;margin:6px 0;flex-wrap:wrap}.adjrow span{flex:1;color:#cfc6a8}
.audit{border-left:4px solid var(--amber);background:#000;padding:8px 10px;margin:6px 0}.audit small{color:#999;display:block}.audit p{margin:2px 0 0;font-size:15px;color:#cfc6a8}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#000;color:var(--lime);border:3px solid var(--lime);padding:10px 16px;font-weight:800;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
/* overlay */
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto;animation:ovin .35s}
@keyframes ovin{from{opacity:0;transform:scale(1.04)}}
.ov.green{background:var(--green)}.ov.black{background:#000}.ov.lime{background:var(--lime);color:#000}.ov.champ{background:radial-gradient(circle at 50% 20%,#1a6a45,#062414);align-items:flex-start}
.ov-c{text-align:center;max-width:560px;width:100%}.ov-c.wide{max-width:620px}
.ov-big{font:400 clamp(44px,14vw,96px)/.9 var(--disp);margin:8px 0;text-shadow:4px 4px 0 #000;animation:slam .5s cubic-bezier(.2,1.6,.4,1)}
.ov.lime .ov-big{color:#000;text-shadow:4px 4px 0 #fff}.ov.lime .k{color:var(--red)}
@keyframes slam{from{transform:scale(2.4);opacity:0}}
.ov-mid{font:400 clamp(24px,7vw,40px)/1 var(--disp);margin:10px 0}.ov-sub{font-weight:800;font-size:22px}
.ov-skip{position:fixed;top:14px;right:14px;background:none;border:2px solid currentColor;color:inherit;font:800 15px var(--cond);padding:6px 10px;cursor:pointer}
.spinball{width:80px;height:80px;margin:0 auto 20px;border-radius:50%;background:#fff radial-gradient(circle,#ccc 2px,transparent 3px) 0 0/12px 12px;animation:spin .8s linear infinite;box-shadow:0 10px 0 -2px #062414}
@keyframes spin{to{transform:rotate(360deg)}}
.ptlist div{display:flex;justify-content:space-between;font:400 28px var(--disp);border-bottom:2px dashed #2f6b4c;padding:6px 4px;animation:slidein .4s both}.ptlist b{color:var(--lime)}
@keyframes slidein{from{opacity:0;transform:translateX(-40px)}}
.flip{position:relative;margin:10px 0}.frow{position:absolute;left:0;right:0;display:grid;grid-template-columns:52px 1fr 70px;gap:4px;height:42px;transition:transform 1.1s cubic-bezier(.5,0,.2,1)}
.frow .slot{min-height:40px}.frow.lead .pts{color:var(--red)}.frow .nm{justify-content:flex-start;font-size:22px;letter-spacing:.06em}.frow .pts{font:400 22px var(--disp)}
.calls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.call{background:var(--lime);color:#000;border:3px solid #000;padding:8px;transform:rotate(-1.5deg);animation:pop .4s both}.call:nth-child(even){transform:rotate(1.5deg);background:var(--amber)}

.duel-cards small{display:block;font-weight:800;text-transform:uppercase;font-size:12px;letter-spacing:.06em;color:#555}
.duel-cards i{font:italic 800 18px var(--cond);color:var(--red)}
.card{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:64px;height:88px;background:#fff;border:3px solid #000;border-radius:8px;box-shadow:3px 3px 0 #000;font:400 26px var(--disp);margin-top:4px}
.card b{font-weight:400;line-height:1}
.fw{font:400 16px var(--disp);color:var(--lime);letter-spacing:.02em}

.brandline{margin:14px 0 4px;opacity:.85}.brandline em{display:block;font:600 12px var(--cond);color:#9fae8e;letter-spacing:.14em;text-transform:uppercase;font-style:normal;margin-top:2px}
.fw-tag{font:400 11px var(--disp);color:var(--lime);opacity:.75;margin-left:8px;font-style:normal;letter-spacing:.04em;align-self:flex-end;padding-bottom:2px}
.fw.big{font-size:clamp(34px,10vw,58px);color:var(--lime);text-shadow:3px 3px 0 #000}
.about-card{background:var(--paper);color:#000;border:3px solid #000;box-shadow:6px 6px 0 #000;padding:14px}
.about-card p{font-weight:600}.about-card .note{color:#555}

.skins th,.skins td{padding:5px 6px;text-align:center;font-variant-numeric:tabular-nums}
.skins tr.par th{background:#e8e2cd;color:#555;font-size:12px}
.skins td:first-child,.skins th:first-child{text-align:left;font-weight:800}
.skins td.skinwin{background:var(--lime);font-weight:800}
.skins tr.carry td{color:var(--red);font-weight:800;font-size:13px;background:#f6f1de}
.skins .tot{font:400 18px var(--disp)}
.skins-ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}.skins-ctrl .btn{margin:0}.skins-ctrl small{color:#555;font-weight:700;width:100%}
.btn.sm.amber{background:var(--amber)}
.skins tr.carry i{font-style:normal;color:var(--felt);font-size:11px;display:block}
.duelcard.live{box-shadow:5px 5px 0 var(--red)}
.seal{width:74px;height:74px;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.6))}
.seal.big{width:120px;height:120px}.seal.mini{width:52px;height:52px;flex:none}
.tcard{position:relative}.tcard .seal.corner{position:absolute;top:6px;right:6px;width:46px;height:46px;z-index:2}
.tcard.founder{border-color:var(--amber);box-shadow:5px 5px 0 var(--amber)}
.mag .seal.mag{position:absolute;right:10px;bottom:96px;top:auto;width:72px;height:72px;z-index:3}
.founder-line{display:flex;gap:12px;align-items:center;background:#000;border:3px solid var(--amber);padding:10px;margin:0 0 12px;cursor:pointer}
.founder-line b{display:block;font:400 18px var(--disp);color:var(--amber)}.founder-line span{font-weight:600;color:#d8cfb3;font-size:15px}
.og{font-style:normal;color:var(--amber);margin-left:4px;font-size:13px;vertical-align:2px}
.charter{background:var(--paper);color:#000;border:4px solid #000;box-shadow:8px 8px 0 var(--amber);padding:16px;margin:12px 0 20px;text-align:center}
.ch-seal{margin-bottom:6px}.ch-text{font-weight:600;max-width:60ch;margin:8px auto}.ch-text.small{font:400 16px var(--hand);color:var(--felt)}
.cards.founders{grid-template-columns:1fr 1fr}
@media (min-width:900px){.cards.founders{grid-template-columns:repeat(4,1fr)}}
.gt-open{background:#2f8f4e;color:#fff}.gt-open small{color:#eafbe8}
.holecard{background:#0b3d24;border:3px solid #000;box-shadow:4px 4px 0 #000;padding:10px;margin:8px 0}
.ho-top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;color:var(--cream)}.ho-top b{font:400 20px var(--disp);color:var(--lime)}.ho-top span{font-weight:700;font-size:14px}.ho-top em{font:400 15px var(--hand);color:var(--amber);font-style:normal;margin-left:auto}
.hole-art{display:block;width:100%;height:auto;border:2px solid #000;margin:8px 0}
.ho-players{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.ho-players i{font:italic 800 16px var(--cond);color:var(--red)}
.ho-p{display:grid;grid-template-columns:44px 1fr auto;grid-template-rows:auto auto;gap:2px 8px;align-items:center;background:#000;border:2px solid #333;padding:6px}
.ho-p.win{border-color:var(--lime);background:#12321a}
.ho-ph{width:44px;height:44px;border-radius:50%;border:2px solid var(--cream);grid-row:span 2}.ho-ph.mono b{font-size:16px}
.ho-p b{font:400 16px var(--disp);color:var(--cream)}.ho-p small{font-weight:700;font-size:12px;color:#bdb59b;grid-column:2}
.ho-score{font:400 30px var(--disp);color:var(--lime);grid-row:span 2}
.ho-story{color:#d8cfb3;font-weight:600;margin:8px 0 4px;font-size:15px}
.ho-result{color:var(--amber);font-weight:800;margin:0;font-size:15px}
.scorecard summary{font-size:18px}
.stbar.upd{background:var(--lime);cursor:pointer}

body{overflow-x:hidden}#app{position:relative}
.crosslink{background:var(--amber);color:#000;border:3px solid #000;box-shadow:4px 4px 0 #000;padding:10px 12px;font:400 18px var(--disp);margin:12px 0;cursor:pointer}
.gt-badge{display:inline-block;min-width:22px;padding:0 6px;border-radius:11px;background:var(--red);color:#fff;font:800 14px/22px var(--cond);text-align:center;vertical-align:2px;margin-left:6px}
.act-row{display:grid;gap:8px;margin-top:10px}

.bc-p.b{border-color:var(--lime)}.bc-p b{font:400 17px var(--disp);color:var(--cream)}.bc-p em{font:400 26px var(--disp);font-style:normal;color:var(--lime)}
.bc-ph{width:40px;height:48px;border:2px solid #000}
.bc-p.wince{transform:rotate(-6deg) scale(.96)}.bc-p.shake{animation:bcshake .5s}.bc-p.flash{animation:bcflash .8s}
@keyframes bcshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes bcflash{0%{box-shadow:0 0 0 0 var(--lime)}50%{box-shadow:0 0 0 8px var(--lime)}100%{box-shadow:0 0 0 0 transparent}}
.bc-meter{text-align:center;min-width:110px}.bc-pot{font:800 11px var(--cond);color:var(--amber);letter-spacing:.06em;text-transform:uppercase}
.bc-bar{position:relative;height:8px;background:linear-gradient(90deg,var(--cream) 50%,var(--lime) 50%);border:2px solid #000;margin:4px 0}.bc-bar i{position:absolute;top:-6px;width:4px;height:16px;background:var(--red);border:1px solid #000;left:50%;transition:left .6s}
.bc-meter small{font-weight:800;color:var(--cream);font-size:11px}
.bc-stage{position:relative;max-width:760px;margin:0 auto;background:#000;border:4px solid #000;box-shadow:6px 6px 0 #000;aspect-ratio:1000/500;overflow:hidden}
#bc-svg{display:block;width:100%;height:100%}
.bc-slam{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000c;color:var(--amber);font:400 clamp(22px,6vw,40px) var(--disp);text-align:center;padding:12px;animation:slam .35s cubic-bezier(.2,1.4,.4,1)}
.bc-inter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--green);padding:14px;color:var(--cream)}
.bc-inter h3{font:400 clamp(20px,5.5vw,30px) var(--disp);margin:6px 0}.bc-inter p{font-weight:700;color:#d8cfb3;margin:0}
.bc-cap{max-width:760px;margin:10px auto 0;min-height:4.4em}
.bc-pbp{font:400 clamp(18px,5vw,26px)/1.15 var(--disp);color:var(--cream);margin:0;text-shadow:3px 3px 0 #000}.bc-pbp.pop{animation:slam .3s cubic-bezier(.2,1.4,.4,1)}
.bc-color{font:400 clamp(15px,4.2vw,19px)/1.2 var(--hand);color:var(--lime);margin:6px 0 0;min-height:1.2em}
.bc-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;max-width:760px;margin:10px auto 0;font-weight:700;color:#bdb59b}.bc-foot .lnk{color:var(--amber)}
.fx text{paint-order:stroke}

/* ---- live match card ---- */
.mt-status{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;background:#000;color:var(--cream);border:3px solid #000;padding:8px 10px;margin:8px 0;font:700 14px var(--cond);letter-spacing:.03em}
.mt-status b{font:400 20px var(--disp);color:var(--lime)}.mt-status em{font-style:normal;color:var(--amber);font-weight:800}.mt-status .btn.poke{margin:0 0 0 auto;padding:4px 10px;font-size:14px}
.mt-dots{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin:0 0 10px}
.mt-dots span{position:relative;text-align:center;font:800 13px var(--cond);padding:5px 0;border:2px solid #000;background:#e8e2cf;color:#777}
.mt-dots span.a{background:var(--cream);color:#000}.mt-dots span.b{background:var(--lime);color:#000}.mt-dots span.half{background:#bfb89f;color:#000}.mt-dots span.next{background:var(--amber);color:#000;box-shadow:2px 2px 0 #000}
.mt-dots span i{position:absolute;top:-8px;right:-4px;background:var(--red);color:#fff;font-style:normal;font-size:10px;padding:0 4px;border:1px solid #000}
.mt-next{border:3px solid #000;box-shadow:4px 4px 0 #000;background:var(--green);margin:0 0 10px}
.mt-next-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;padding:8px 10px;color:var(--cream);font-weight:700}.mt-next-h .k{margin:0;color:var(--amber)}.mt-next-h b{font:400 22px var(--disp)}.mt-next-h em{font:400 15px var(--hand);color:var(--lime)}
.mt-next .hole-art{display:block;width:100%;border-top:3px solid #000}
.mt-last{border:3px solid #000;background:var(--paper);margin:0 0 10px}.mt-last summary{list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 10px;cursor:pointer;font-weight:700}.mt-last summary::-webkit-details-marker{display:none}
.mt-last summary .k{margin:0}.mt-last summary b{font:400 18px var(--disp)}.mt-sc{background:#000;color:var(--cream);padding:2px 8px;font:800 13px var(--cond)}.mt-sc.w{background:var(--lime);color:#000}.mt-last summary em{font-style:normal;color:var(--green);font-weight:800;margin-left:auto}.mt-last summary i{font-style:normal;font-weight:900;color:var(--amber)}
.mt-last[open] summary i{transform:rotate(45deg)}.mt-last .holecard{margin:0;border-top:3px solid #000}
.mt-holes .holecard{border:3px solid #000;box-shadow:4px 4px 0 #000;margin:12px 0}
.mt-primary{margin:10px 0 6px}.mt-second{margin:0 0 6px}.mt-second .btn{display:inline-block;width:auto;padding:6px 12px}
.mt-quiet{display:flex;justify-content:space-between;gap:12px;margin:8px 0 2px;font-weight:800}.mt-quiet .lnk{font:800 14px var(--cond);letter-spacing:.04em;text-transform:uppercase;color:var(--green)}.mt-quiet .lnk.red{color:var(--red)}
.duelcard.live{border-width:4px}

.mt-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 6px}
.mtile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;aspect-ratio:1.6/1;background:var(--cream);color:#000;border:3px solid #000;box-shadow:4px 4px 0 #000;padding:8px;cursor:pointer;text-align:center;font-family:var(--body)}
.mtile span{font-size:26px;line-height:1}.mtile b{font:400 19px var(--disp)}.mtile small{font:700 12px var(--cond);letter-spacing:.03em;opacity:.75}
.mtile.go{background:var(--lime)}.mtile.amber{background:var(--amber)}.mtile.paper{background:var(--paper)}.mtile.danger{background:var(--red);color:#fff}.mtile.danger small{opacity:.9}
.mtile.muted,.mtile.done{background:#e8e2cf;color:#777;box-shadow:none;transform:translate(4px,4px)}
.mtile:active{transform:translate(4px,4px);box-shadow:none}
.mt-tiles>.mtile:last-child:nth-child(odd){grid-column:1/-1;aspect-ratio:auto;flex-direction:row;gap:10px;padding:10px}.mt-tiles>.mtile:last-child:nth-child(odd) span{font-size:22px}

.sec-div{height:0;border-top:4px solid #000;margin:26px 0 6px;position:relative}.sec-div::after{content:"";position:absolute;left:0;right:0;top:2px;border-top:2px solid var(--amber)}
.duelcard.live{margin-bottom:18px}
.done-row{background:var(--paper);border:3px solid #000;box-shadow:3px 3px 0 #000;margin:8px 0}
.done-row summary{list-style:none;display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:8px 10px;cursor:pointer}
.done-row summary::-webkit-details-marker{display:none}
.dr-names{font:400 18px var(--disp);color:#000}.dr-names i{font:italic 800 12px var(--cond);color:var(--red);margin:0 2px}
.dr-res{font:700 13px var(--cond);color:#444;letter-spacing:.03em}
.stamp.mini{position:static;transform:rotate(-6deg);font-size:11px;padding:1px 6px;margin:0 4px}
.dr-plus{font-style:normal;font-weight:900;color:var(--amber)}.done-row[open] .dr-plus{transform:rotate(45deg)}
.dr-body{border-top:3px solid #000;padding:8px}.dr-body .duelcard{margin:0;box-shadow:none;border-width:0}

.sec small{font:800 13px var(--cond);color:#bdb59b;letter-spacing:.06em;margin-left:8px;vertical-align:middle}
.duel-mini{background:#000;color:var(--cream);border:3px solid #000;border-left:8px solid var(--amber);padding:10px 12px;margin:0 0 14px;cursor:pointer}
.dm-top{display:flex;justify-content:space-between;align-items:center;gap:8px}.dm-top b{font:400 19px var(--disp)}
.dm-dots{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;margin:8px 0}.dm-dots span{height:6px;background:#333}.dm-dots span.a{background:var(--cream)}.dm-dots span.b{background:var(--lime)}.dm-dots span.half{background:#8a8367}.dm-dots span.next{background:var(--amber)}
.dm-status{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font:700 13px var(--cond);letter-spacing:.03em;color:#d8cfb3}.dm-status em{font-style:normal;color:var(--amber)}.dm-status i{margin-left:auto;font-style:normal;color:var(--lime);font-weight:800}

  try{ const f=new URLSearchParams({'form-name':'signup',event:state.tournament.name,link:url,plan:cfg.tier==='weekend'?'The Weekend ($99)':'The Season ($149)',commissioner:((cfg.commissioner.first||'')+' '+(cfg.commissioner.last||'')).trim(),email:cfg.commissioner.email||'',mobile:cfg.commissioner.mobile||'',venmo:cfg.commissioner.venmo||'',golfers:String(state.players.length),first_round:(state.rounds[0]&&(state.rounds[0].course+' · '+(state.rounds[0].date||'')))||'',again:j.again?'yes (retry)':'no'});
   fetch('/new.html',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:f.toString()}).catch(()=>{}); }catch(e){}
  const invite=`⛳ ${state.tournament.name}${cfg.dates?' · '+cfg.dates:''}\n\n${url}\n\n1) Open that in Safari, tap Share → Add to Home Screen, then open it from the icon.\n2) Pick your name once (that phone becomes you).\n3) Feed → 🔔 Turn on notifications.`;
  out.innerHTML=`<section class="done"><p class="k">It’s live</p><h2>${esc(state.tournament.name)}</h2><a class="btn wide big" href="${url}">Open your site →</a>${missed?`<p class="err">${missed} photo${missed===1?'':'s'} didn’t upload — add them later from Commissioner → Golfers.</p>`:''}<p class="note">Commissioner PIN: <b>${esc(cfg.pin)}</b>. More → Commissioner → unlock → Setup for the checklist.</p><label>Text this to the group<textarea rows="6" readonly>${esc(invite)}</textarea></label><button type="button" class="btn ghost wide" data-act="copy" data-v="${esc(invite)}">Copy the invite</button></section>`;
  try{ localStorage.removeItem('fairwaze-new'); }catch(e){}
 }catch(e){ out.innerHTML='<p class="err">No connection. Try again.</p>'; }
}
document.addEventListener('click',async e=>{ const el=e.target.closest('[data-act]'); if(!el) return; const act=el.dataset.act; read();
 if(act==='next'){ const v=validate(); if(v){ alert(v); return; } step++; view(); window.scrollTo(0,0); if(step===STEPS.length-1) checkSlug(); }
 else if(act==='back'){ step--; view(); window.scrollTo(0,0); }
 else if(act==='addP'){ if(cfg.players.length>=144){ alert('144 golfers is the most one event holds. Bigger than that? Contact us and we’ll set it up.'); return; } cfg.players.push({first:'',last:'',hi:'',venmo:'',mobile:''}); view(); }
 else if(act==='pasteP'){ const lines=(document.getElementById('p-paste').value||'').split(/\n+/).map(l=>l.trim()).filter(Boolean); let added=0;
  cfg.players=cfg.players.filter(p=>(p.first||'').trim()||(p.last||'').trim());
  for(const l of lines){ if(cfg.players.length>=144) break; const parts=l.split(/\t|,/).map(x=>x.trim()).filter(Boolean); let hi=''; if(parts.length>1&&/^[+-]?\d+(\.\d+)?$/.test(parts[parts.length-1])) hi=parts.pop(); const nm=parts.join(' ').split(/\s+/); if(!nm[0]) continue; cfg.players.push({first:nm[0],last:nm.slice(1).join(' '),hi,venmo:'',mobile:''}); added++; }
  view(); alert(added?`Added ${added} golfer${added===1?'':'s'}.${cfg.players.length>=144?' That’s the 144 maximum.':''}`:'Nothing to add — one golfer per line, like: Mike Smith, 12.4'); }
 else if(act==='delP'){ cfg.players.splice(Number(el.dataset.i),1); view(); }
 else if(act==='addR'){ cfg.rounds.push({nick:'',course:'',date:'',tee:'',format:'scramble',teamSize:4}); view(); }
 else if(act==='delR'){ cfg.rounds.splice(Number(el.dataset.i),1); view(); }
 else if(act==='tag'){ cfg.tagline=el.dataset.v; view(); }
 else if(act==='build'){ build(); }
 else if(act==='copy'){ try{ await navigator.clipboard.writeText(el.dataset.v); el.textContent='Copied'; }catch(e){} }
});
document.addEventListener('change',async e=>{ const el=e.target; if(el.dataset&&el.dataset.photo!==undefined&&el.files&&el.files[0]){ read(); const i=Number(el.dataset.photo); try{ cfg.players[i].photo=await shrink(el.files[0]); }catch(err){ alert('Couldn’t read that photo'); } view(); } });
document.addEventListener('input',e=>{ if(e.target.id==='s-slug'){ read(); clearTimeout(window._slugT); window._slugT=setTimeout(checkSlug,400); } if(e.target.id==='f-name'&&!cfg.slug){ /* suggest a link later */ } });
try{ const saved=JSON.parse(localStorage.getItem('fairwaze-new')||'null'); if(saved&&saved.name!==undefined) Object.assign(cfg,saved); }catch(e){}
try{ const t=new URLSearchParams(location.search).get('tier'); if(t==='season'||t==='weekend') cfg.tier=t; }catch(e){}
view();

</script></body></html>
